services:
  - type: web
    name: streamforge-downloader-backend
    env: node
    region: oregon
    plan: free
    buildCommand: "cd backend && npm install && npm run build && apt-get update && apt-get install -y python3 python3-pip ffmpeg && pip3 install yt-dlp"
    startCommand: "cd backend && npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
